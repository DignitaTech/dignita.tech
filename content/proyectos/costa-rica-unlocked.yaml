title: Costa Rica Unlocked
category: Branding
sector: "Turismo & experiencias"
year: "2024"
description: Identidad de marca para una agencia de viajes y tours.
accent: "#00629A"
published: true
cover: /branding/costa-rica-unlocked/portada.png
summary: Identidad para una agencia que abre la Costa Rica auténtica — la que no sale en los folletos.
challenge: Costa Rica compite con cientos de operadores que venden las mismas postales. La marca necesitaba sentirse local, vibrante y premium a la vez, capaz de vivir igual de bien en una camiseta, una van o el feed de un viajero.
approach: Partimos de un logotipo manuscrito con personalidad y lo anclamos a una paleta tomada del país. La tipografía Proxima Nova ordena la información sin apagar la energía del lettering.
result: Un sistema cálido y memorable que viaja bien — del merchandising a la flota, del empaque a la señalética, todo se reconoce como Costa Rica Unlocked.
