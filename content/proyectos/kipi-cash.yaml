title: Kipi.cash
category: Branding
sector: Fintech
year: "2024"
description: Identidad de marca para una fintech.
accent: "#4157EE"
published: true
cover: /branding/kipi-cash/portada.jpg
summary: La identidad de una fintech pensada para que mover dinero se sienta simple, cercano y confiable.
challenge: Kipi.cash llegaba a un mercado saturado de apps financieras frías y genéricas. Necesitaba una identidad que transmitiera confianza sin sacrificar cercanía, y que funcionara igual en una pantalla de onboarding que en una gorra.
approach: Construimos un sistema visual sobre un azul eléctrico, equilibrado con una paleta pastel que humaniza cada punto de contacto. El logotipo es directo y legible; Helvetica Neue mantiene todo limpio y operativo.
result: Una marca flexible y reconocible, lista para escalar de la app a la calle — producto digital, merchandising y señalética comparten el mismo ADN.
